<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="header" >
    <div class="head">
        <a onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></a>
    </div>
    Add an activity
    <div class="head">
        <a onclick="window.location.replace('./signup')""><i class="fa-duotone fa-solid fa-circle-user"></i></a>
    </div>
</div>
<script src="../defer.js" type="module"></script>

<div class="content">
    <form class="activity-form" id="activity-form">
        <label for="activity">Activity</label>
        <select class="dlgelem" id="activity" name="activity" required>
            <option value="run">Run</option>
            <option value="ride">Ride</option>
            <option value="walk">Walk</option>
            <option value="swim">Swim</option>
            <option value="other">Other</option>
        </select>

        <label for="activityname">Name</label>
        <input class="dlgelem" id="activityname" name="activityname" type="text" required>

        <label for="activitydescription">Description</label>
        <textarea class="dlgelem" id="activitydescription" name="activitydescription" rows="3"></textarea>

        <label for="activitydate">Date and time</label>
        <input class="dlgelem" id="activitydate" name="activitydate" type="datetime-local" required>

        <label for="durationminutes">Duration</label>
        <div class="duration-inputs">
            <input class="dlgelem" id="durationminutes" name="durationminutes" type="number" min="0" placeholder="Minutes" required>
            <input class="dlgelem" id="durationseconds" name="durationseconds" type="number" min="0" max="59" placeholder="Seconds" value="0" required>
        </div>

        <label for="distancemeters">Distance (km)</label>
        <input class="dlgelem" id="distancemeters" name="distancemeters" type="number" min="0" step="0.01" required>

        <label for="otherinfo">Other information</label>
        <textarea class="dlgelem" id="otherinfo" name="otherinfo" rows="2"></textarea>

        <button class="dlgelem" type="submit">Save activity</button>
        <p id="activity-message" role="status"></p>
    </form>
</div>
<script src="./activity.js" type="module"></script>

<div class="footer" >
    <div class="nav" id="nav1">
        <a href="../home/"><i class="fa-duotone fa-solid fa-house"></i></a>
    </div>
    <div class="nav" id="nav2">
        <a href="./"><i class="fa-duotone fa-solid fa-square-plus"></i></a>
    </div>
    <div class="nav" id="nav3">
        <a href="../social"></ahref><i class="fa-duotone fa-solid fa-user-group"></i></a>
    </div>
    <div class="nav" id="nav4">
        <a href="../settings"><i class="fa-duotone fa-solid fa-gear"></i></a>
    </div>
    </div>
</div>
</body>
</html>

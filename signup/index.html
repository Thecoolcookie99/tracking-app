<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<script src="../defer.js" type="module"></script>
<script src="other.js"></script>

<div class="header">
    <div class="head">
        <a onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></a>
    </div>
    Sign up
    <div>ㅤ</div>
</div>

<div class="main">
    <div class="signup-dialouge">
        <p class="title">Sign up</p>
        <hr>
        <input type="text"     id="username" class="dlgelem">
        <input type="text"     id="name" class="dlgelem" placeholder="Name" required>
        <input type="email"    id="email" class="dlgelem" placeholder="Email" required>
        <input type="number"   id="age" class="dlgelem" placeholder="Age" min="13" max="120" required>
        <input type="number"   id="weight" class="dlgelem" placeholder="Weight (kg)" min="1" max="500" step="0.1" required>
        <input type="password" id="password" class="dlgelem">
        <button class="submit" id="submit"   class="dlgelem" onclick="submit()">Create account</button>
        <a class="bottomtext" href="../login">log in</a>
    </div>
</div>
</body>
</html>

<html>
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<script src="../defer.js" type="module"></script>

<div class="header" >
    <div class="head">
        <a onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
    </div>
    Settings
    <div class="head">
        <a onclick="window.location.replace('../signup')"><i class="fa-duotone fa-solid fa-circle-user"></i></a>
    </div>
</div>

<div class="content">
    <form class="settings-form" id="profile-form">
        <p class="title">Profile</p>
        <input class="dlgelem" id="profile-name" type="text" placeholder="Name" required>
        <input class="dlgelem" id="profile-email" type="email" placeholder="Email" required>
        <input class="dlgelem" id="profile-age" type="number" min="13" max="120" placeholder="Age" required>
        <input class="dlgelem" id="profile-weight" type="number" min="1" max="500" step="0.1" placeholder="Weight (kg)" required>
        <button class="dlgelem" type="submit">Save profile</button>
        <p id="profile-message" role="status"></p>
    </form>

    <form class="settings-form" id="friend-settings">
        <p class="title">Friend settings</p>
        <label class="setting-option">
            Show friends on the social page
            <input id="show-friends" type="checkbox">
        </label>
        <label class="setting-option">
            Show friend activity status
            <input id="show-friend-activity" type="checkbox">
        </label>
        <button class="dlgelem" type="submit">Save settings</button>
        <p id="settings-message" role="status"></p>
    </form>

    <form class="settings-form" id="goals-form">
        <p class="title">Daily goals</p>
        <label class="setting-option" for="sleep-goal">Sleep (hours)
            <input id="sleep-goal" type="number" min="0" step="0.1" required>
        </label>
        <label class="setting-option" for="steps-goal">Steps
            <input id="steps-goal" type="number" min="0" required>
        </label>
        <label class="setting-option" for="water-goal">Water (ml)
            <input id="water-goal" type="number" min="0" required>
        </label>
        <label class="setting-option" for="calories-goal">Calories
            <input id="calories-goal" type="number" min="0" required>
        </label>
        <label class="setting-option" for="streak-goal">Streak (days)
            <input id="streak-goal" type="number" min="0" required>
        </label>
        <button class="dlgelem" type="submit">Save goals</button>
        <p id="goals-message" role="status"></p>
    </form>

    <form class="settings-form" id="widget-settings">
        <p class="title">Home widgets</p>
        <label class="setting-option widget-option"><input type="checkbox" value="recent/sml"> Recent activity</label>
        <label class="setting-option widget-option"><input type="checkbox" value="sleep_/lrg"> Sleep</label>
        <label class="setting-option widget-option"><input type="checkbox" value="steps_/sml"> Steps</label>
        <label class="setting-option widget-option"><input type="checkbox" value="addact/lrg"> Add activity</label>
        <label class="setting-option widget-option"><input type="checkbox" value="streak/sml"> Streak</label>
        <label class="setting-option widget-option"><input type="checkbox" value="social/lrg"> Social</label>
        <label class="setting-option widget-option"><input type="checkbox" value="water_/sml"> Water</label>
        <label class="setting-option widget-option"><input type="checkbox" value="calori/lrg"> Calories</label>
        <button class="dlgelem" type="submit">Save widgets</button>
        <p id="widget-message" role="status"></p>
    </form>

    <button class="dlgelem sign-out-button" id="sign-out" type="button">Sign out</button>
</div>
<script src="./settings.js" type="module"></script>

<div class="footer" >
    <div class="nav" id="nav1">
        <a href="../home/"><i class="fa-duotone fa-solid fa-house"></i></a>
    </div>
    <div class="nav" id="nav2">
        <a href="../addactivity/"><i class="fa-duotone fa-solid fa-square-plus"></i></a>
    </div>
    <div class="nav" id="nav3">
        <a href="../social"></ahref><i class="fa-duotone fa-solid fa-user-group"></i></a>
    </div>
    <div class="nav" id="nav4">
        <a href="./"><i class="fa-duotone fa-solid fa-gear"></i></a>
    </div>
    </div>
</div>
</body>
</html>
